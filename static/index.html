<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подбор подрядчиков</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1c1a; --muted: #6b6862; --line: #e3e0da;
    --accent: #2f5d50; --accent-soft: #e4efe9;
    --ok: #2f6b3a; --ok-soft: #e3f1e5; --warn: #8a5a00; --warn-soft: #fbf0d9;
    --bad: #9b2c2c; --bad-soft: #f8e3e1; --info-soft: #eceaf6; --info: #4a3f8f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --surface: #1f1e1c; --text: #ecebe7; --muted: #a19d95; --line: #34322e;
      --accent: #7fbfa9; --accent-soft: #1f302a;
      --ok: #8fd19b; --ok-soft: #1d2e20; --warn: #e8bd6a; --warn-soft: #33291a;
      --bad: #ef9a93; --bad-soft: #3a2220; --info-soft: #25223a; --info: #b3aaf0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
         display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                          border-radius: 6px; padding: 7px 9px; min-width: 0; }
  button.primary { background: var(--accent); color: var(--surface); border: none; font-weight: 600;
                   cursor: pointer; align-self: end; padding: 9px; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 22px; }
  .presets button { cursor: pointer; font-size: 13px; background: var(--surface); }
  .presets button:hover { border-color: var(--accent); }
  .outcome { border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .outcome .label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .outcome p { margin: 6px 0 0; }
  .o-found { background: var(--ok-soft); } .o-found .label { color: var(--ok); }
  .o-no_category_in_city { background: var(--info-soft); } .o-no_category_in_city .label { color: var(--info); }
  .o-no_match { background: var(--warn-soft); } .o-no_match .label { color: var(--warn); }
  .o-invalid_request { background: var(--bad-soft); } .o-invalid_request .label { color: var(--bad); }
  .cards { display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
  .rank { font-weight: 700; color: var(--accent); }
  .name { font-weight: 700; font-size: 17px; }
  .meta { color: var(--muted); font-size: 14px; }
  .why { margin: 8px 0 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 12px; border-radius: 99px; padding: 2px 9px; background: var(--accent-soft); color: var(--accent); }
  .badge.syn { background: var(--warn-soft); color: var(--warn); }
  .badge.real { background: var(--ok-soft); color: var(--ok); }
  details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  details table { border-collapse: collapse; margin-top: 6px; }
  details td { padding: 2px 10px 2px 0; }
  .block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
           padding: 12px 16px; margin-top: 14px; }
  .block h3 { font-size: 14px; margin: 0 0 6px; }
  .block ul { margin: 0; padding-left: 18px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>Подбор подрядчиков</h1>
  <p class="sub">До трёх подрядчиков из каталога с объяснением, почему именно они. Занятые на дату в выдачу не попадают.</p>

  <form id="f">
    <label>Город <select name="city" required></select></label>
    <label>Дата <input type="date" name="date" required></label>
    <label>Тип мероприятия <select name="event_format" required></select></label>
    <label>Категория <select name="category" required></select></label>
    <label>Бюджет, ₸ <input type="number" name="budget" min="1" step="10000" required></label>
    <label>Длительность, ч <input type="number" name="hours" min="1" step="0.5" placeholder="необязательно"></label>
    <label>Язык <select name="language"><option value="">любой</option></select></label>
    <button class="primary" type="submit">Подобрать</button>
  </form>
  <div class="presets" id="presets"></div>
  <div id="out"></div>
  <p class="foot" id="foot"></p>
</main>
<script>
const f = document.getElementById("f");
const out = document.getElementById("out");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fill = (sel, items, fmt = x => [x, x]) =>
  items.forEach(i => { const [v, t] = fmt(i); sel.insertAdjacentHTML("beforeend", `<option value="${esc(v)}">${esc(t)}</option>`); });

async function init() {
  const o = await (await fetch("/api/options")).json();
  fill(f.city, o.cities);
  fill(f.event_format, o.formats);
  fill(f.category, o.categories, c => [c.name, `${c.name} (${c.count})`]);
  fill(f.language, o.languages);
  f.date.min = o.window[0]; f.date.max = o.window[1]; f.date.value = "2026-11-14";
  f.budget.value = 500000;
  document.getElementById("foot").textContent =
    `Данные: ${o.data.file}, профилей ${o.data.total}, из них синтетических ${o.data.synthetic}.`;
  const sc = await (await fetch("/api/scenarios")).json();
  const box = document.getElementById("presets");
  sc.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = s.title;
    b.onclick = () => { setForm(s.params); run(); };
    box.appendChild(b);
  });
}

function setForm(p) {
  for (const k of ["city", "date", "event_format", "category", "budget", "hours", "language"])
    f[k].value = p[k] ?? "";
}

async function run() {
  const params = Object.fromEntries(new FormData(f).entries());
  out.innerHTML = "<p class='sub'>Подбираем…</p>";
  const r = await (await fetch("/api/recommend", {method: "POST", headers: {"Content-Type": "application/json"},
                                                   body: JSON.stringify(params)})).json();
  render(r);
}

function render(r) {
  let h = `<div class="outcome o-${esc(r.outcome)}"><div class="label">${esc(r.outcome_label)}</div>
           <p>${esc(r.headline)}</p>`;
  for (const k of ["why_fewer", "date_effect"]) if (r[k]) h += `<p>${esc(r[k])}</p>`;
  (r.notes || []).forEach(n => h += `<p>${esc(n)}</p>`);
  h += "</div><div class='cards'>";
  (r.cards || []).forEach(c => {
    const prov = c.synthetic ? "syn" : "real";
    h += `<article class="card"><header><span class="rank">#${c.rank}</span><span class="name">${esc(c.name)}</span>
      <span class="meta">${esc(c.category)} · ${esc(c.city)} · ${esc(c.price_text)}</span></header>
      <p class="why">${esc(c.explanation)}</p>
      <div class="badges"><span class="badge ${prov}">${esc(c.provenance)}</span>
      ${c.flags.map(x => `<span class="badge syn">${esc(x)}</span>`).join("")}</div>
      <details><summary>Как считали место в выдаче (итог ${c.score.toFixed(3)})</summary><table>
      ${Object.entries(c.score_parts).map(([k, v]) => `<tr><td>${esc(PARTS[k] || k)}</td><td>${v}</td></tr>`).join("")}
      </table>Форматы: ${esc(c.formats.join(", "))}. Языки: ${esc(c.languages.join(", "))}.
      Часы: ${c.max_hours == null ? "не привязаны к площадке" : "до " + c.max_hours}.</details></article>`;
  });
  h += "</div>";
  if (r.outcome !== "found" && r.rejected && r.rejected.length) {
    h += `<div class="block"><h3>Почему не подошли</h3><ul>` +
      r.rejected.map(x => `<li><b>${esc(x.name)}</b>: ${esc(x.reasons.join("; "))}</li>`).join("") + "</ul></div>";
  } else if (r.rejected && r.rejected.length) {
    h += `<details class="block"><summary>Не прошли условия (${r.rejected.length})</summary><ul>` +
      r.rejected.map(x => `<li><b>${esc(x.name)}</b>: ${esc(x.reasons.join("; "))}</li>`).join("") + "</ul></details>";
  }
  if (r.suggestions && r.suggestions.length)
    h += `<div class="block"><h3>Что можно сделать</h3><ul>${r.suggestions.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>`;
  if (r.elapsed_ms != null) h += `<p class="foot">Ответ за ${r.elapsed_ms} мс.</p>`;
  out.innerHTML = h;
}
const PARTS = {relevance: "смысл описания и специализация (35%)", budget: "запас по бюджету (30%)",
               language: "язык (15%)", hours: "часы на площадке (10%)", quality: "надёжность данных (10%)"};

f.addEventListener("submit", e => { e.preventDefault(); run(); });
init();
</script>
</body>
</html>
